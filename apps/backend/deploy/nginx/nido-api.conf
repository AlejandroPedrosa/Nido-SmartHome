# ============================================================
# NIDO SmartHome — Nginx como proxy inverso de la API (EC2)
#
# Instalación (se COPIA, no se enlaza: certbot edita el archivo
# instalado al agregar HTTPS y no debe modificar el repositorio):
#   sudo cp apps/backend/deploy/nginx/nido-api.conf /etc/nginx/sites-available/nido-api
#   sudo ln -s /etc/nginx/sites-available/nido-api /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d nido-api.duckdns.org   # agrega el bloque 443
#
# Si el subdominio de DuckDNS es otro, cambiar server_name.
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name nido-api.duckdns.org;

    access_log /var/log/nginx/nido-api.access.log;
    error_log /var/log/nginx/nido-api.error.log;

    # La API solo recibe JSON chico: limita el tamaño del body.
    client_max_body_size 1m;

    location / {
        # El contenedor publica la API solo en localhost (docker-compose.yml).
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
